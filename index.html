<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Amber Language Studio v3</title><style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a12;color:#c8c8d4;font-family:'SF Mono',Monaco,Consolas,monospace;overflow:hidden;height:100vh;display:flex;flex-direction:column}
#header{display:flex;align-items:center;justify-content:space-between;padding:6px 12px;background:linear-gradient(180deg,#14142a,#0a0a12);border-bottom:1px solid #1a1a3a;flex-shrink:0;z-index:10}
#header h1{font-size:14px;color:#f0a030;letter-spacing:1px}
#header h1 span{color:#888;font-size:10px;font-weight:400}
#modes{display:flex;gap:3px;flex-wrap:wrap;max-width:60vw}
.mbtn{background:#1a1a2e;color:#888;border:1px solid #2a2a4a;padding:4px 8px;font-size:10px;font-family:inherit;cursor:pointer;border-radius:3px;transition:all .2s;white-space:nowrap}
.mbtn:hover{border-color:#f0a030;color:#ccc}
.mbtn.on{background:#f0a03022;border-color:#f0a030;color:#f0a030}
#hud{font-size:10px;color:#555;text-align:right}
#hud span{color:#f0a030}
canvas{display:block;flex:1}
#input-area{display:none;flex-direction:column;gap:4px;padding:6px 12px;background:#0a0a12;border-top:1px solid #1a1a3a;flex-shrink:0}
#input-area.active{display:flex}
#input-area textarea{flex:1;background:#111122;border:1px solid #2a2a4a;color:#e0e0e8;padding:6px;font-family:inherit;font-size:11px;border-radius:3px;resize:none;min-height:48px}
#input-area textarea:focus{outline:none;border-color:#f0a030}
#compile-row{display:flex;gap:4px;align-items:center}
#compile-btn{background:#f0a030;color:#000;border:none;padding:6px 16px;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;border-radius:3px}
#compile-btn:hover{background:#ffb840}
#output-area{display:none;flex-direction:column;padding:6px 12px 6px;background:#060610;border-top:1px solid #1a1a3a;flex-shrink:0}
#output-area.active{display:flex}
#output-area .label{font-size:9px;color:#555;margin-bottom:2px;text-transform:uppercase;letter-spacing:1px}
#output-code{background:#0a0a16;border:1px solid #1a1a3a;color:#40c8a0;padding:6px;font-family:inherit;font-size:10px;border-radius:3px;overflow:auto;white-space:pre;flex:1;line-height:1.4}
#output-code .kw{color:#f0a030}
#output-code .str{color:#40c8a0}
#output-code .cmt{color:#444}
#log{position:fixed;bottom:80px;right:12px;width:280px;max-height:160px;overflow-y:auto;font-size:9px;color:#555;background:#0a0a12ee;border:1px solid #1a1a3a;border-radius:3px;padding:6px;pointer-events:none;z-index:20}
#log div{margin-bottom:1px;border-left:2px solid #2a2a4a;padding-left:4px}
#log .warn{border-color:#f0a030;color:#f0a030}
#log .err{border-color:#e04040;color:#e04040}
@media(max-width:600px){
#header h1{font-size:11px}
.mbtn{padding:3px 5px;font-size:8px}
}
</style></head><body>
<div id="header">
<h1>AMBER <span>Language Studio</span></h1>
<div id="modes">
<button class="mbtn on" data-m="0">SOURCE</button>
<button class="mbtn" data-m="1">COMPILE</button>
<button class="mbtn" data-m="2">COMPARE</button>
<button class="mbtn" data-m="3">DECORATORS</button>
<button class="mbtn" data-m="4">SANDBOX</button>
<button class="mbtn" data-m="5">AST</button>
</div>
<div id="hud"><span id="h-tok">0</span> tokens | <span id="h-stg">0</span> stages</div>
</div>
<canvas id="c"></canvas>
<div id="input-area" class="active">
<textarea id="code" spellcheck="false" placeholder="// Amber source code
print('hello world')
func factorial(n)
  if n <= 1 then return 1
  return n * factorial(n - 1)
end"></textarea>
<div id="compile-row">
<button id="compile-btn">COMPILE &#9654;</button>
</div>
</div>
<div id="output-area">
<div class="label">Generated Shell Output</div>
<div id="output-code"></div>
</div>
<div id="log"></div>
<script>
(function(){
const cv=document.getElementById('c'),cx=cv.getContext('2d');
let W,H,mode=0,tick=0;
const defaultCode=`// Amber: High-level language compiled to shell
var greeting = "Hello from Amber!"
print(greeting)

// Calculate factorial with pattern matching
func factorial(n)
  match n
    0 => 1
    1 => 1
    _ => n * factorial(n - 1)
  end
end

// Decorated function
@cache
@retry(max=3)
func expensive_compute(x)
  return x * x + x
end

print(factorial(6))
print(expensive_compute(42))
`;
document.getElementById('code').value=defaultCode;

function resize(){W=cv.width=cv.clientWidth;H=cv.height=cv.clientHeight}
window.addEventListener('resize',resize);resize();

// Mode buttons
document.querySelectorAll('.mbtn').forEach(b=>{
b.addEventListener('click',()=>{
document.querySelectorAll('.mbtn').forEach(x=>x.classList.remove('on'));
b.classList.add('on');mode=+b.dataset.m;
});
});

// Touch swipe
let tx=0;
cv.addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});
cv.addEventListener('touchend',e=>{
const d=e.changedTouches[0].clientX-tx;
if(Math.abs(d)>50){
if(d<0)mode=(mode+1)%6;else mode=(mode+5)%6;
document.querySelectorAll('.mbtn').forEach((b,i)=>{b.classList.toggle('on',i===mode)});
}
},{passive:true});

// Keyboard nav
document.addEventListener('keydown,e=>{
if(e.key==='ArrowRight'){mode=(mode+1)%6;document.querySelectorAll('.mbtn').forEach((b,i)=>{b.classList.toggle('on',i===mode)})}
if(e.key==='ArrowLeft'){mode=(mode+5)%6;document.querySelectorAll('.mbtn').forEach((b,i)=>{b.classList.toggle('on',i===mode)})}
if(e.key==='Enter'&&!e.ctrlKey){e.preventDefault();doCompile()}
});

// Canvas mouse events for AST hover
var _mouseX=0,_mouseY=0;
cv.addEventListener('mousemove',e=>{
if(mode!==5)return;
const rect=cv.getBoundingClientRect();
_mouseX=e.clientX-rect.left;
_mouseY=e.clientY-rect.top;
// Hit test against node bounds
var hit=null;
for(var i=_nodeBounds.length-1;i>=0;i--){
var b=_nodeBounds[i];
var r=b.rect;
if(_mouseX>=r.x&&_mouseX<=r.x+r.w&&_mouseY>=r.y&&_mouseY<=r.y+r.h){
hit=b.node;
break;
}
}
_hoveredNode=hit;
});
cv.addEventListener('mouseleave',()=>{_hoveredNode=null;});
cv.addEventListener('click',e=>{
if(mode!==5)return;
for(var i=_nodeBounds.length-1;i>=0;i--){
var b=_nodeBounds[i];
var r=b.rect;
if(_mouseX>=r.x&&_mouseX<=r.x+r.w&&_mouseY>=r.y&&_mouseY<=r.y+r.h){
// Click to select node — animate through this node's children
if(b.node.children&&b.node.children.length>0){
// Collect all descendant nodes and animate through them
var descendants=[];
function collectDesc(n){
if(n.children)n.children.forEach(function(c){descendants.push(c);collectDesc(c)});
}
collectDesc(b.node);
if(descendants.length>0){
// Use the first child as current for demo purposes
var visits={current:0,max:descendants.length,visited:new Set()};
// Set visits.current to first child to highlight it
visits.current=0;
visits.visited.add(descendants[0]);
}
}
break;
}
}
});

// AST Interactive state
var _astNodesFlat=[],_hoveredNode=null,_sourceHighlightLines=[];
function flatAST(node,cb){if(!node)return;if(cb)cb(node);if(node.children)node.children.forEach(function(c){flatAST(c,cb)});}

// AST node bounding box tracker
var _nodeBounds=[];
function buildNodeBounds(node,x,y,w,h,depth,maxDepth){
if(depth>maxDepth||!node)return;
const nodeW=Math.min(180,w*0.8);
const nodeH=22+depth*4;
const nx=x-(nodeW/2)*(1+depth*0.15);
const ny=y-nodeH/2;
_nodeBounds.push({node:node,rect:{x:nx,y:ny,w:nodeW,h:nodeH},depth:depth});
const childCount=Math.min(node.children?node.children.length:0,8);
if(childCount>0&&depth<maxDepth){
const childSpacing=nodeH+14;
const startY=y+nodeH/2+8;
const childW2=w*0.8*0.9;
for(var c=0;c<childCount;c++){
const childX=nx+nodeW/2+(c-childCount/2+0.5)*(nodeW/(childCount+1))*0.9;
const childY=startY+c*childSpacing;
buildNodeBounds(node.children[c],childX,childY+childSpacing*0.5,childW2,22,depth+1,maxDepth);
}
}
}

// Seeded PRNG
function rng(seed){let s=seed;return()=>{s=(s*1664525+101****4223)&0x7fffffff;return s/0x7fffffff}}
const R=rng(42);

function log(msg,cls){
const l=document.getElementById('log');
const d=document.createElement('div');
d.className=cls||'';d.textContent='['+new Date().toLocaleTimeString()+'] '+msg;
l.appendChild(d);l.scrollTop=l.scrollHeight;
if(l.children.length>50)l.removeChild(l.firstChild);
}

// Particle system
class Particle{
constructor(x,y,vx,vy,col,life){this.x=x;this.y=y;this.vx=vx;this.vy=vy;this.col=col;this.life=life;this.ml=life;this.trail=[];}
update(){this.trail.push({x:this.x,y:this.y});if(this.trail.length>8)this.trail.shift();this.x+=this.vx;this.y+=this.vy;this.vx*=0.99;this.vy*=0.99;this.life--;return this.life>0}
draw(){
if(this.life<=0)return;
const a=this.life/this.ml;
cx.globalAlpha=a*0.8;
cx.fillStyle=this.col;
for(let i=0;i<this.trail.length;i++){
const t=this.trail[i];cx.globalAlpha=a*(i/this.trail.length)*0.4;
cx.beginPath();cx.arc(t.x,t.y,1.5,0,6.28);cx.fill();
}
cx.globalAlpha=a;cx.beginPath();cx.arc(this.x,this.y,2,0,6.28);cx.fill();
cx.globalAlpha=1;
}
}

let particles=[];
let compileState={phase:0,progress:0,done:false,shellOutput:''};

function spawnParticle(x,y,col){
const angle=R()*Math.PI*2,speed=0.5+R()*2;
particles.push(new Particle(x,y,Math.cos(angle)*speed,Math.sin(angle)*speed,col,40+R()*40));
}

const KEYWORDS=['var','func','if','then','else','end','return','print','for','while','in','import','as','match','case','=>','with'];
const BUILTINS=['print','len','range','abs','max','min','type','match'];

function tokenize(src){
const tokens=[];
const re=/\s+|\/\/.*|"[^"]*"|'[^']*'|=>|@[a-zA-Z_]\w*|[a-zA-Z_]\w*|[+\-*/=<>!&|{}()[\]:;.]+|\d+/g;
let m;while((m=re.exec(src))!==null){
const w=m[0];if(!w.trim().length)continue;
let type='ident';
if(KEYWORDS.includes(w))type='kw';
else if(BUILTINS.includes(w))type='builtin';
else if(w.startsWith('@'))type='decorator';
else if(/^\d/.test(w))type='number';
else if(w==='=>')type='arrow';
tokens.push({word:w,type});
}
return tokens;
}

// Simple Amber -> Bash compiler
function amberToBash(src){
const lines=src.split('\n');
let bash='#!/bin/bash\n# Compiled by Amber Language\n# Generated from Amber source\n\n';
let inFunc=0,indentStack=[];
const funcStack=[];

for(let i=0;i<lines.length;i++){
const line=lines[i];
const trimmed=line.trim();
if(!trimmed||trimmed.startsWith('//')){
if(trimmed.startsWith('//'))bash+=trimmed.replace('//','# ')+ '\n';
continue;
}

// Decorator line (skip, compile to bash comments)
if(trimmed.startsWith('@')){
bash+=`# Decorator: ${trimmed.replace('@','')}\n`;
continue;
}

// match statement
if(trimmed.startsWith('match ')){
const varName=trimmed.replace('match ','');
bash+=`case $${varName} in\n`;
inFunc++;
continue;
}

// match case (N => val)
const caseMatch=trimmed.match(/^(\d+|_)\s*=>\s*(.+)$/);
if(caseMatch){
const label=caseMatch[1]==='_':'*';
const expr=caseMatch[2].replace(/\bif\b/g,'if [ ').replace(/\bthen\b/g,'then');
bash+=`  ${label}) ${expr} ;;\n`;
continue;
}

// match end
if(trimmed==='end'){
bash+='esac\n';
inFunc--;
continue;
}

// func declaration
const funcMatch=trimmed.match(/^func\s+(\w+)\((\w+)\)/);
if(funcMatch){
bash+=`\n# ${funcMatch[1]} function\n${funcMatch[1]}(){\nlocal ${funcMatch[2]}=$1\n`;
inFunc++;
continue;
}

// func end
if(trimmed==='end'&&inFunc>0){
bash+='}\n';
inFunc--;
continue;
}

// variable assignment
const varMatch=trimmed.match(/^var\s+(\w+)\s*=\s*"(.*)"/);
if(varMatch){
bash+=`export ${varMatch[1]}="${varMatch[2]}"\n`;
continue;
}

// simple variable
const varMatch2=trimmed.match(/^(\w+)\s*=\s*(.+)$/);
if(varMatch2){
bash+=`${varMatch2[1]}=${varMatch2[2]}\n`;
continue;
}

// if statement
const ifMatch=trimmed.match(/if\s+(.+)\s+then/);
if(ifMatch){
const cond=ifMatch[1].replace(/\bthen\b/,'').trim();
bash+=`if [ ${cond} ]; then\n`;
continue;
}

// if (single line)
if(trimmed.startsWith('if ')){
bash+=`if [ ${trimmed.replace('if ','').replace(/then$/,'').trim()} ]; then\n`;
continue;
}

// return
const retMatch=trimmed.match(/^return\s+(.+)$/);
if(retMatch){
bash+=`return ${retMatch[1]}\n`;
continue;
}

// print -> echo
const printMatch=trimmed.match(/^print\((.+)\)$/);
if(printMatch){
bash+=`echo ${printMatch[1].replace(/"/g,'\\\"')}\n`;
continue;
}

// direct print (no parens)
if(trimmed.startsWith('print ')){
bash+=`echo "${trimmed.replace('print ','')}"\n`;
continue;
}

// for loop
const forMatch=trimmed.match(/for\s+(\w+)\s+in\s+(.+)$/);
if(forMatch){
bash+=`for ${forMatch[1]} in ${forMatch[2]}; do\n`;
continue;
}

// while
const whileMatch=trimmed.match(/while\s+(.+)$/);
if(whileMatch){
bash+=`while ${whileMatch[1]}; do\n`;
continue;
}

// for/while end
if(trimmed==='# done' || (trimmed.startsWith('# done'))){
bash+='done\n';
continue;
}

// default: pass through
if(trimmed)bash+=`${line}\n`;
}

if(inFunc>0)bash+='}\n';
return bash;
}

function doCompile(){
const src=document.getElementById('code').value;
if(!src.trim()){log('No source code','err');return}
compileState={phase:0,progress:0,done:false,shellOutput:amberToBash(src)};
particles=[];
log('Starting Amber compilation...');
const tokens=tokenize(src);
document.getElementById('h-tok').textContent=tokens.length;
log('Tokenized: '+tokens.length+' tokens');

// Generate shell output
const shellOutput=amberToBash(src);
const outputDiv=document.getElementById('output-code');
outputDiv.innerHTML=highlightBash(shellOutput);

document.getElementById('output-area').classList.add('active');
document.getElementById('input-area').classList.add('active');
log('Shell output generated');
}

function highlightBash(code){
return code.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
.replace(/(#!.*|^\s*#.*)/gm,'<span class="cmt">$1</span>')
.replace(/\b(if|then|else|elif|fi|for|while|do|done|case|esac|function|return|export|local)\b/g,'<span class="kw">$1</span>')
.replace(/"([^"]*)"/g,'"<span class="str">$1</span>"');
}

document.getElementById('compile-btn').addEventListener('click',doCompile);

function drawGrid(){
cx.fillStyle='#0a0a12';cx.fillRect(0,0,W,H);
cx.strokeStyle='#111122';cx.lineWidth=0.5;
const g=40;
for(let x=0;x<W;x+=g){cx.beginPath();cx.moveTo(x,0);cx.lineTo(x,H);cx.stroke()}
for(let y=0;y<H;y+=g){cx.beginPath();cx.moveTo(0,y);cx.lineTo(W,y);cx.stroke()}
}

// === MODE 0: SOURCE EDITOR (enhanced) ===
function drawSource(){
drawGrid();
const src=document.getElementById('code').value||defaultCode;
const lines=src.split('\n');
const lh=15;const startY=40;

cx.font='12px SF Mono,Monaco,Consolas,monospace';
for(let i=0;i<Math.min(lines.length,Math.floor((H-60)/lh));i++){
const y=startY+i*lh;
const tokens=tokenize(lines[i]);
let x=16;
for(const t of tokens){
if(t.type==='kw')cx.fillStyle='#f0a030';
else if(t.type==='decorator')cx.fillStyle='#e040e0';
else if(t.type==='arrow')cx.fillStyle='#8080f0';
else if(t.type==='number')cx.fillStyle='#40c8a0';
else if(t.type==='builtin')cx.fillStyle='#4080f0';
else cx.fillStyle='#c8c8d4';
cx.fillText(t.word,x,y);
x+=cx.measureText(t.word).width+1;
}
}

cx.fillStyle='#333';cx.font='10px monospace';
for(let i=0;i<Math.min(lines.length,Math.floor((H-60)/lh));i++){
cx.fillText(''+(i+1),8,startY+i*lh);
}

if(tick%3===0){
const active=Math.min(lines.length,Math.floor((H-60)/lh));
const li=Math.floor(R()*active);
const tokens=tokenize(lines[li]);
if(tokens.length){
const t=R()<0.15?'#e040e0':R()<0.25?'#f0a030':R()<0.4?'#40c8a0':R()<0.55?'#4080f0':'#555';
spawnParticle(20+R()*200,startY+li*lh+8,t);
}
}
particles=particles.filter(p=>{p.draw();return p.update()});

cx.fillStyle='#f0a03030';cx.font='bold 11px monospace';
cx.fillText('AMBER SOURCE — '+tokenize(src.split('\n').filter((_,i)=>i<Math.min(10,lines.length)).join('\n')).length+' tokens | @decorator | match/=>',16,H-12);
}

// === MODE 1: COMPILE PIPELINE (real-time) ===
function drawCompile(){
drawGrid();
const stages=['SOURCE','TOKENIZE','PARSE','TRANSFORM','CODE GEN','SHELL'];
const colors=['#40c8a0','#8080f0','#f0a030','#e040e0','#e08040','#e04040'];
const sx=W/2;
const stageH=90;const startY=50;

for(let i=0;i<stages.length;i++){
const y=startY+i*stageH;
const active=compileState.phase>i;
const current=compileState.phase===i;

const bw=Math.min(320,W-40);
const bx=sx-bw/2;
cx.strokeStyle=current?'#f0a030':active?'#40c8a066':'#1a1a3a';
cx.lineWidth=current?2:1;
cx.fillStyle=active?'#1a2a1a':'#0f0f1f';
cx.fillRect(bx,y,bw,65);cx.strokeRect(bx,y,bw,65);

cx.fillStyle=current?'#f0a030':active?'#40c8a0':'#555';
cx.font='bold 11px monospace';
cx.fillText(stages[i],bx+10,y+20);

if(current){
const pw=(bw-60)*compileState.progress;
cx.fillStyle='#f0a03044';cx.fillRect(bx+20,y+32,bw-60,10);
cx.fillStyle='#f0a030';cx.fillRect(bx+20,y+32,pw,10);
cx.fillStyle='#888';cx.font='9px monospace';
cx.fillText(Math.floor(compileState.progress*100)+'%',bx+20,y+55);
}else if(active){
cx.fillStyle='#40c8a0';cx.fillRect(bx+20,y+32,bw-60,10);
cx.fillStyle='#888';cx.font='9px monospace';
cx.fillText('DONE',bx+20,y+55);
}else{
cx.fillStyle='#222';cx.fillRect(bx+20,y+32,bw-60,10);
cx.fillStyle='#333';cx.font='9px monospace';
cx.fillText('WAITING',bx+20,y+55);
}

if(i<stages.length-1){
const ay=y+72;
cx.strokeStyle='#2a2a4a';cx.lineWidth=1;
cx.beginPath();cx.moveTo(sx-80,ay);cx.lineTo(sx+80,ay);cx.stroke();
cx.fillStyle='#f0a030';cx.beginPath();
cx.moveTo(sx+80,ay);cx.lineTo(sx+74,ay-4);cx.lineTo(sx+74,ay+4);cx.fill();
}
}

if(tick%4===0){
for(let i=0;i<Math.min(compileState.phase+1,6);i++){
const y=startY+i*stageH+30;
spawnParticle(sx+(R()-0.5)*100,y,colors[i]||'#f0a030');
}
}
particles=particles.filter(p=>{p.draw();return p.update()});

if(compileState.phase<6&&!compileState.done){
if(compileState.progress<1){
compileState.progress+=0.012+R()*0.008;
}else{
compileState.phase++;compileState.progress=0;
if(compileState.phase===6){
compileState.done=true;
log('Compilation complete! '+compileState.shellOutput.split('\n').length+' lines of shell output.');
}
}
}

cx.fillStyle=compileState.done?'#40c8a0':'#f0a030';
cx.font='bold 12px monospace';cx.textAlign='center';
cx.fillText(compileState.done?'COMPILED SUCCESSFULLY':'COMPILING... '+Math.floor(Math.min(compileState.progress*100,100))+'%',sx,H-15);
cx.textAlign='left';
document.getElementById('h-stg').textContent=compileState.phase;

// Show shell output preview
if(compileState.shellOutput){
const lines=compileState.shellOutput.split('\n').slice(0,8);
const previewY=H-80;
cx.fillStyle='#0a0a12';cx.fillRect(10,previewY,W-20,70);
cx.fillStyle='#333';cx.font='9px monospace';
for(let i=0;i<lines.length&&i<4;i++){
const l=lines[i].replace(/&/g,'&amp;').replace(/</g,'&lt;');
cx.fillStyle=lines[i].trim().startsWith('#')?'#444':'#40c8a066';
cx.fillText(lines[i].substring(0,50),15,previewY+14+i*15);
}
cx.fillStyle='#555';cx.font='9px monospace';
cx.fillText('# compiled output preview...',W-140,previewY+14);
}
}

// === MODE 2: COMPARE (8 language matrix) ===
function drawCompare(){
drawGrid();
const targets=[
{name:'BASH',color:'#e04040',icon:'🐚'},
{name:'KSH',color:'#e08040',icon:'🐚'},
{name:'ZSH',color:'#f0a030',icon:'🐚'},
{name:'PYTHON',color:'#40c8a0',icon:'🐍'},
{name:'NODE.JS',color:'#40c8a0',icon:'⬢'},

// === MODE 5: AST VISUALIZER ===
function parseAmberAST(src){
const lines=src.split('\n');
const ast={type:'program',children:[],lineNumber:0};
let currentBlock=ast;
let funcName='';
let inFunc=0;
let inMatch=0;
let matchVar='';
let inMatchBranch=false;
let matchBranch=null;

for(let i=0;i<lines.length;i++){
const line=lines[i];
const trimmed=line.trim();
if(!trimmed||trimmed.startsWith('//'))continue;

// Decorator
if(trimmed.startsWith('@')){
const decNode={type:'decorator',value:trimmed.replace('@',''),children:[],lineNumber:i+1};
currentBlock.children.push(decNode);
continue;
}

// match statement
const matchM=trimmed.match(/^match\s+(\w+)(\s+on\s+(\w+))?$/);
if(matchM){
const matchNode={type:'match',variable:matchM[1],on:matchM[3]||null,branches:[],children:[],lineNumber:i+1};
currentBlock.children.push(matchNode);
inMatch++;
matchVar=matchM[1];
inMatchBranch=false;
currentBlock=matchNode;
continue;
}

// match case
const caseM=trimmed.match(/^(.+?)\s*=>\s*(.+)$/);
if(caseM&&inMatch>0){
const branchNode={type:'match-branch',pattern:caseM[1],guard:matchM&&matchM[3]?'on '+matchM[3]:null,children:[],lineNumber:i+1};
if(inMatchBranch&&matchBranch){
matchBranch.children.push(branchNode);
}else{
currentBlock.branches.push(branchNode);
matchBranch=branchNode;
inMatchBranch=true;
currentBlock=branchNode;
}
continue;
}

// match end
if(trimmed==='end'&&inMatch>0){
inMatch--;
if(matchBranch){
matchBranch=null;
inMatchBranch=false;
}
currentBlock=matchVar==='main'?ast:matchVar==='main'?ast:{type:'program',children:[]};
continue;
}

// func declaration
const funcM=trimmed.match(/^func\s+(\w+)(?:\((\w+)\))?\s*(:\s*(.+))?$/);
if(funcM){
const funcNode={type:'function',name:funcM[1],param:funcM[2]||null,returns:funcM[4]||null,children:[],lineNumber:i+1};
currentBlock.children.push(funcNode);
currentBlock=funcNode;
inFunc++;
funcName=funcM[1];
continue;
}

// func end
if(trimmed==='end'&&inFunc>0){
inFunc--;
currentBlock={type:'program',children:[]};
funcName='';
continue;
}

// if statement
const ifM=trimmed.match(/^if\s+(.+?)\s+then$/);
if(ifM){
const condNode={type:'if',condition:ifM[1],thenBranch:[],elseBranch:[],lineNumber:i+1};
currentBlock.children.push(condNode);
currentBlock=condNode;
continue;
}

// if end (single line)
if(trimmed==='fi'||(trimmed.startsWith('fi'))){
if(currentBlock.type==='if'){
currentBlock={type:'program',children:[]};
}
continue;
}

// variable assignment
const varM=trimmed.match(/^(\w+)\s*=\s*(.+)$/);
if(varM){
const assignNode={type:'assign',name:varM[1],value:varM[2],lineNumber:i+1};
currentBlock.children.push(assignNode);
continue;
}

// print statement
const printM=trimmed.match(/^print\s*\((.+)\)$/);
if(printM){
const callNode={type:'call',name:'print',args:[printM[1]],lineNumber:i+1};
currentBlock.children.push(callNode);
continue;
}

// direct print
if(trimmed.startsWith('print ')){
const callNode={type:'call',name:'print',args:[trimmed.replace('print ','')],lineNumber:i+1};
currentBlock.children.push(callNode);
continue;
}

// for loop
const forM=trimmed.match(/^for\s+(\w+)\s+in\s+(.+)$/);
if(forM){
const forNode={type:'for',variable:forM[1],iterable:forM[2],body:[],lineNumber:i+1};
currentBlock.children.push(forNode);
currentBlock=forNode;
continue;
}

// while
const whileM=trimmed.match(/^while\s+(.+)$/);
if(whileM){
const whileNode={type:'while',condition:whileM[1],body:[],lineNumber:i+1};
currentBlock.children.push(whileNode);
currentBlock=whileNode;
continue;
}

// return
const retM=trimmed.match(/^return\s+(.+)$/);
if(retM){
const retNode={type:'return',expression:retM[1],lineNumber:i+1};
currentBlock.children.push(retNode);
continue;
}

// default: expression
const exprNode={type:'expression',code:trimmed,lineNumber:i+1};
currentBlock.children.push(exprNode);
}

return ast;
}

function getASTColor(type){
const map={
'program':'#f0a030',
'function':'#40c8a0',
'call':'#e08040',
'assign':'#4080f0',
'if':'#e04040',
'for':'#8080f0',
'while':'#8080f0',
'return':'#e04040',
'match':'#e040e0',
'match-branch':'#40c8a0',
'decorator':'#f0a030',
'expression':'#888',
'param':'#4080f0'
};
return map[type]||'#888';
}

function drawASTNode(node,x,y,w,h,depth,maxDepth,visits){
if(depth>maxDepth)return;

const nodeW=Math.min(180,w*0.8);
const nodeH=22+depth*4;
const nx=x-(nodeW/2)*(1+depth*0.15);
const ny=y-nodeH/2;

const color=getASTColor(node.type);
const isSelected=visits.visited.has(visits.current);

// Glow effect for visited nodes
if(isSelected){
cx.shadowColor=color;
cx.shadowBlur=12;
}

// Draw node box
cx.fillStyle=isSelected?color+'33':'#0f0f1f';
cx.strokeStyle=isSelected?color:color+'66';
cx.lineWidth=isSelected?2:1;
cx.fillRect(nx,ny,nodeW,nodeH);
cx.strokeRect(nx,ny,nodeW,nodeH);

cx.shadowBlur=0;

// Node text
cx.fillStyle=isSelected?'#fff':'#888';
cx.font=`${isSelected?'bold ':''}${11-depth}px monospace`;
cx.textAlign='center';

let label=node.type;
if(node.type==='function')label='func '+node.name;
else if(node.type==='call')label='call '+node.name;
else if(node.type==='assign')label=node.name+' =';
else if(node.type==='decorator')label='@'+node.value;
else if(node.type==='match')label='match '+node.variable;
else if(node.type==='if')label='if '+node.condition.substring(0,15);
else if(node.type==='for')label='for '+node.variable;
else if(node.type==='while')label='while';
else if(node.type==='return')label='return '+(node.expression||'')+'...';
else if(node.type==='match-branch')label=node.pattern+' => ...';
else if(node.type==='expression')label=(node.code||'').substring(0,12);
else label=node.type;

if(label.length>18)label=label.substring(0,16)+'..';
cx.fillText(label,nx+nodeW/2,ny+15);
cx.textAlign='left';

// Process children
const childCount=Math.min(node.children?node.children.length:0,8);
if(childCount>0&&depth<maxDepth){
const childSpacing=nodeH+14;
const startY=y+nodeH/2+8;

for(let c=0;c<childCount;c++){
const child=node.children[c];
const childX=nx+nodeW/2+(c-childCount/2+0.5)*(nodeW/(childCount+1))*0.9;
const childY=startY+c*childSpacing;

// Draw connection line
cx.strokeStyle=color+'44';
cx.lineWidth=1;
cx.beginPath();
cx.moveTo(nx+nodeW/2,y+nodeH/2);
cx.lineTo(childX,startY+c*childSpacing);
cx.stroke();

// Draw child node
drawASTNode(child,childX,childY+childSpacing*0.5,
nodeW*0.9,22,depth+1,maxDepth,visits);
}
}
}

// Stats

const maxDepth=getMaxDepth(ast);

// Source code lines for highlighting
const srcLines=src.split('\n');

_nodeBounds=[];
buildNodeBounds(ast,W/2,55,200,30,0,Math.min(maxDepth,6));

if(_hoveredNode){

// Render tree centered with hover highlighting
const startX=W/2;
const startY=55;
const visits={current:0,max:totalNodes,visited:new Set()};

// Draw root node with hover check
function drawASTWithHover(node,x,y,w,h,depth,maxDepth,visits,hoverCheck){

const nodeW=Math.min(180,w*0.8);
const nodeH=22+depth*4;

// Glow effect

cx.shadowColor=color;
cx.shadowBlur=15;

cx.strokeRect(nx-2,ny-2,nodeW+4,nodeH+4);

}

// Draw node box

cx.lineWidth=isHovered?2:1;
cx.fillRect(nx,ny,nodeW,nodeH);
cx.strokeRect(nx,ny,nodeW,nodeH);

// Node text
cx.fillStyle=isHovered?'#000':'#888';
cx.font=`${isHovered?'bold ':''}${11-depth}px monospace`;
cx.textAlign='center';

let label=node.type;
if(node.type==='function')label='func '+node.name;
else if(node.type==='call')label='call '+node.name;
else if(node.type==='assign')label=node.name+' =';
else if(node.type==='decorator')label='@'+node.value;
else if(node.type==='match')label='match '+node.variable;
else if(node.type==='if')label='if '+node.condition.substring(0,15);
else if(node.type==='for')label='for '+node.variable;
else if(node.type==='while')label='while';
else if(node.type==='return')label='return '+(node.expression||'')+'...';
else if(node.type==='match-branch')label=node.pattern+' => ...';
else if(node.type==='expression')label=(node.code||'').substring(0,12);
else label=node.type;

if(label.length>18)label=label.substring(0,16)+'..';
cx.fillText(label,nx+nodeW/2,ny+15);
cx.textAlign='left';

// Tooltip for hovered node
if(isHovered){
let tip=node.type;
if(node.name)tip+=' ('+node.name+')';
if(node.variable)tip+=' on '+node.variable;
if(node.condition)tip+=' — '+node.condition;

cx.fillStyle='#f0a030';
cx.font='bold 10px monospace';
cx.textAlign='left';
cx.fillText('⬥ '+tip,10,H-45);
}

// Process children
const childCount=Math.min(node.children?node.children.length:0,8);
if(childCount>0&&depth<maxDepth){
const childSpacing=nodeH+14;
const startY=y+nodeH/2+8;

for(let c=0;c<childCount;c++){
const child=node.children[c];
const childX=nx+nodeW/2+(c-childCount/2+0.5)*(nodeW/(childCount+1))*0.9;
const childY=startY+c*childSpacing;

// Draw connection line
cx.strokeStyle=color+'44';
cx.lineWidth=1;
cx.beginPath();
cx.moveTo(nx+nodeW/2,y+nodeH/2);
cx.lineTo(childX,startY+c*childSpacing);
cx.stroke();

// Draw child node
drawASTWithHover(child,childX,childY+childSpacing*0.5,
nodeW*0.9,22,depth+1,maxDepth,visits,hoverCheck);
}
}
}

// Hover check function
function isNodeHovered(node){
return _hoveredNode===node;
}

drawASTWithHover(ast,startX,startY,200,30,0,Math.min(maxDepth,6),visits,isNodeHovered);

// Legend
const legY=H-30;
cx.fillStyle='#555';cx.font='9px monospace';
cx.textAlign='center';
cx.fillText('Color key: func(🟢) call(🟠) assign(🔵) if(🔴) for/while(🟣) match(🟣) decorator(🟡) expression(⚪)',W/2,legY);
cx.textAlign='left';

// Decorative particles
if(tick%5===0){
const types=['program','function','call','assign','if','match'];
const randomType=types[Math.floor(R()*types.length)];
const px=10+R()*(W-20);
const py=30+R()*(H-100);
spawnParticle(px,py,getASTColor(randomType));
}
particles=particles.filter(p=>{p.draw();return p.update()});

// Update HUD
document.getElementById('h-tok').textContent=totalNodes+' nodes';
document.getElementById('h-stg').textContent='depth '+maxDepth;
}

function countNodes(node){
if(!node||!node.children)return 1;
let count=1;
for(const child of node.children)count+=countNodes(child);
return count;
}

function getMaxDepth(node){
if(!node||!node.children||node.children.length===0)return 1;
let max=0;
for(const child of node.children){
const d=getMaxDepth(child);
if(d>max)max=d;
}
return 1+max;
}

// === MODE 4: SANDBOX ===
function drawSandbox(){
drawGrid();
const env={
vars:{greeting:'Hello Amber',result:'720',name:'Amber',version:'1.0'},
scope:'global',
pipeline:['PARSE','TOKENIZE','TRANSFORM','CODE GEN','EXECUTE'],
envVars:{HOME:'/home',SHELL:'/bin/amber',PATH:'.',LANG:'en_US'}
};

// Left panel
const px=10;const py=20;
cx.fillStyle='#0f0f1f';cx.fillRect(px,py,240,H-30);
cx.strokeStyle='#1a1a3a';cx.lineWidth=1;cx.strokeRect(px,py,240,H-30);

cx.fillStyle='#f0a030';cx.font='bold 11px monospace';
cx.fillText('VARIABLE EXPLORER',px+8,py+16);

let vy=py+28;
cx.fillStyle='#888';cx.font='10px monospace';
cx.fillText('Scope: '+env.scope,px+8,vy);vy+=14;
cx.fillStyle='#555';cx.fillText('--- Environment ---',px+8,vy);vy+=12;
for(const[k,v]of Object.entries(env.envVars)){
cx.fillStyle='#40c8a0';cx.font='9px monospace';
cx.fillText(k+'='+v,px+8,vy);vy+=14;
}
cx.fillStyle='#555';cx.fillText('--- Variables ---',px+8,vy);vy+=12;
for(const[k,v]of Object.entries(env.vars)){
cx.fillStyle='#f0a030';cx.font='9px monospace';
cx.fillText(k+' = '+v,px+8,vy);vy+=14;
}

// Center: Pipeline flow
cx.fillStyle='#888';cx.font='bold 11px monospace';
cx.textAlign='center';
cx.fillText('EXECUTION PIPELINE',W/2,20);
cx.textAlign='left';

const pl=env.pipeline;
const phaseW=120;const phaseGap=16;
const totalPw=pl.length*phaseW+(pl.length-1)*phaseGap;
const pSX=(W/2)-totalPw/2;
const pY=35;

for(let i=0;i<pl.length;i++){
const x=pSX+i*(phaseW+phaseGap);
cx.fillStyle='#0f0f1f';cx.strokeStyle=i<3?'#40c8a0':'#2a2a4a';
cx.lineWidth=1;
cx.fillRect(x,pY,phaseW,50);cx.strokeRect(x,pY,phaseW,50);

const done=i<3;
cx.fillStyle=done?'#40c8a0':'#f0a030';
cx.fillRect(x+6,pY+6,5,5);
cx.fillStyle=done?'#40c8a0':'#f0a030';
cx.font='10px monospace';cx.textAlign='center';
cx.fillText(pl[i].toUpperCase(),x+phaseW/2,pY+28);
cx.textAlign='left';

if(i<pl.length-1){
cx.strokeStyle='#f0a03044';cx.lineWidth=1;
cx.beginPath();cx.moveTo(x+phaseW,pY+25);
cx.lineTo(x+phaseW+phaseGap-4,pY+25);cx.stroke();
cx.fillStyle='#f0a03044';
cx.beginPath();
cx.moveTo(x+phaseW+phaseGap-4,pY+25);
cx.lineTo(x+phaseW+phaseGap-10,pY+21);
cx.lineTo(x+phaseW+phaseGap-10,pY+29);cx.fill();
}
}

// Right panel: Event log
const rx=W-250;const ry=10;
cx.fillStyle='#0f0f1f';cx.fillRect(rx,ry,240,200);
cx.strokeStyle='#1a1a3a';cx.strokeRect(rx,ry,240,200);

cx.fillStyle='#f0a030';cx.font='bold 11px monospace';
cx.fillText('EXECUTION LOG',rx+8,ry+16);

const events=[
{t:'00:00.001',msg:'Amber runtime v1.0 loaded',color:'#40c8a0'},
{t:'00:00.003',msg:'Tokenizing source...',color:'#888'},
{t:'00:00.006',msg:'AST built (depth: 6)',color:'#888'},
{t:'00:00.010',msg:'Decorators applied: @cache, @retry',color:'#f0a030'},
{t:'00:00.014',msg:'Code gen: 42 lines of Bash',color:'#f0a030'},
{t:'00:00.018',msg:'Running: factorial(6)',color:'#40c8a0'},
{t:'00:00.022',msg:'Recursion: depth 6, result 720',color:'#40c8a0'},
{t:'00:00.025',msg:'Print: Hello Amber!',color:'#40c8a0'},
{t:'00:00.030',msg:'Pipeline complete, exit 0',color:'#40c8a0'},
];

for(let i=0;i<Math.min(events.length,Math.floor(180/14));i++){
const ey=ry+26+i*14;
cx.fillStyle='#333';cx.font='8px monospace';
cx.fillText(events[i].t,rx+6,ey);
cx.fillStyle=events[i].color;
cx.fillText(events[i].msg,rx+55,ey);
}

// Exit code
cx.fillStyle='#40c8a0';cx.font='bold 11px monospace';
cx.textAlign='center';
cx.fillText('EXIT CODE: 0 (SUCCESS) | '+env.pipeline.length+' stages',W/2,H-15);
cx.textAlign='left';

// Decorative particles
if(tick%5===0){
spawnParticle(W/2+(R()-0.5)*200,40,'#f0a030');
}
particles=particles.filter(p=>{p.draw();return p.update()});
}

// Main loop
function animate(){
if(window._amberMode !== undefined) mode = window._amberMode;
resize();
tick++;
switch(mode){
case 0:drawSource();break;
case 1:drawCompile();break;
case 2:drawCompare();break;
case 3:drawDecorators();break;
case 4:drawSandbox();break;
case 5:drawAST();break;
}
requestAnimationFrame(animate);
}

log('Amber Language Studio v3.0','warn');
log('6 modes: Source, Compile, Compare, Decorators, Sandbox, AST','');
log('Click COMPILE to generate shell output','');
log('Swipe/Arrow keys to switch modes','');
animate();
})();
</script></body></html>
